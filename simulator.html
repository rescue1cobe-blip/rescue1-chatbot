    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #D32F2F;
            --light-primary-color: #FFEBEE;
            --text-color: #222;
            --border-color: #ddd;
            --bg-color: #f7f7fb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .chat-header {
            background: linear-gradient(90deg, #D32F2F, #b71c1c);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #B71C1C;
        }

        .chat-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
            letter-spacing: 0.02em;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
            padding-bottom: 200px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .message.bot .message-content {
            background: white;
            border: 1px solid #e0e0e0;
            color: var(--text-color);
        }

        .message.user .message-content {
            background: var(--primary-color);
            color: white;
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-reply-btn, .option-btn {
            background: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quick-reply-btn:hover, .option-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .select-input, input[type="number"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
        }

        .select-input:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .result-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: white;
            border-top: 3px solid var(--primary-color);
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            z-index: 1000;
        }

        .result-total {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 15px;
        }

        .result-breakdown {
            font-size: 11px;
            color: #666;
            margin-bottom: 15px;
        }

        .result-breakdown p {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-line {
            background: #06C755;
            color: white;
        }

        .btn-line:hover {
            background: #05b34b;
        }

        .btn-call {
            background: var(--primary-color);
            color: white;
        }

        .btn-call:hover {
            background: #b71c1c;
        }

        .distance-slider-container {
            margin-top: 15px;
        }

        .distance-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

        function submitLocationChoice(hasLocation) {
            estimateData.hasLocation = hasLocation;
            
            if (hasLocation) {
                addMessage('はい', 'user');
                
                // 位置情報を取得
                addMessage('位置情報を取得しています...', 'bot');
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            // 位置情報取得成功
                            estimateData.latitude = position.coords.latitude;
                            estimateData.longitude = position.coords.longitude;
                            
                            addMessage('✓ 位置情報を取得しました', 'bot');
                            
                            // LINE送信画面へ
                            setTimeout(function() {
                                sendToLine();
                            }, 500);
                        },
                        function(error) {
                            // 位置情報取得失敗
                            let errorMsg = '';
                            switch(error.code) {
                                case error.PERMISSION_DENIED:
                                    errorMsg = '位置情報の利用が許可されていません。';
                                    break;
                                case error.POSITION_UNAVAILABLE:
                                    errorMsg = '位置情報が取得できませんでした。';
                                    break;
                                case error.TIMEOUT:
                                    errorMsg = '位置情報の取得がタイムアウトしました。';
                                    break;
                                default:
                                    errorMsg = '位置情報の取得に失敗しました。';
                                    break;

                            const msg = '<div style="background: #FFEBEE; padding: 15px; border-radius: 10px; border-left: 4px solid #F44336; margin: 10px 0;">' +

                                '<p style="font-size: 13px; color: #666;">位置情報なしで続行します。</p>' +
                                '</div>';
                            addMessage(msg, 'bot');
                            
                            // 位置情報なしでLINE送信へ
                            estimateData.hasLocation = false;
                            setTimeout(function() {
                                sendToLine();
                            }, 1500);
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                } else {
                    // Geolocation API非対応
                    const msg = '<div style="background: #FFEBEE; padding: 15px; border-radius: 10px; border-left: 4px solid #F44336; margin: 10px 0;">' +

                    addMessage(msg, 'bot');
                    
                    estimateData.hasLocation = false;

                setTimeout(function() {
                    sendToLine();
                }, 300);
            }

                summaryMsg += '<p style="font-size: 11px; color: #333; display: flex; justify-content: space-between; margin: 3px 0;"><span>作業料金</span><span>¥' + estimateData.repairFee.toLocaleString() + '</span></p>';
                if (estimateData.timeFee > 0) {
                    summaryMsg += '<p style="font-size: 11px; color: #333; display: flex; justify-content: space-between; margin: 3px 0;"><span>時間帯追加料金</span><span>¥' + estimateData.timeFee.toLocaleString() + '</span></p>';
                }
            }
            
            summaryMsg += '</div>';
            
            summaryMsg += '<p style="font-size: 28px; font-weight: bold; color: #D32F2F; margin-bottom: 5px;">合計: ¥' + estimateData.total.toLocaleString() + '</p>';
            summaryMsg += '<p style="font-size: 12px; color: #666;">※この見積もりは概算です</p>';
            summaryMsg += '</div>';
            summaryMsg += '<p style="margin-top: 15px;">この内容で相談しますか？</p>';
            summaryMsg += '<div class="button-group" style="margin-top: 10px;">';
            summaryMsg += '<button class="option-btn" onclick="confirmConsultation(true)" style="background: #4CAF50; color: white;">はい</button>';
            summaryMsg += '<button class="option-btn" onclick="confirmConsultation(false)" style="background: #999; color: white;">いいえ</button>';
            summaryMsg += '</div>';
            
            addMessage(summaryMsg, 'bot');
        }

        // ===== 相談確認 =====
        function confirmConsultation(confirmed) {
            if (confirmed) {
                addMessage('はい', 'user');
                showLineDiscountOffer();
            } else {
                addMessage('いいえ', 'user');
                addMessage('ご利用ありがとうございました。またのご利用をお待ちしております。', 'bot');
                showContactNumbers();
            }
        }

        // ===== LINE割引案内 =====
        function showLineDiscountOffer() {
            const discountMsg = '<div style="background: #E8F5E9; padding: 15px; border-radius: 10px; margin: 10px 0; border: 2px solid #4CAF50;">' +
                '<p style="font-weight: bold; color: #2E7D32; margin-bottom: 10px;">💰 LINE送信で¥1,000割引！</p>' +
                '<p style="margin-bottom: 5px;">担当者にLINEで見積もりを送信すると</p>' +
                '<p style="margin-bottom: 10px;">問診時間短縮のため<strong style="color: #D32F2F;">¥1,000割引</strong>になります</p>' +
                '<p style="font-size: 20px; font-weight: bold; color: #D32F2F;">割引後: ¥' + (estimateData.total - 1000).toLocaleString() + '</p>' +
                '</div>' +
                '<p style="margin-top: 15px;">送信しますか？</p>' +
                '<div class="button-group" style="margin-top: 10px;">' +
                '<button class="option-btn" onclick="confirmLineSubmit(true)" style="background: #06C755; color: white;">はい（LINE送信）</button>' +
                '<button class="option-btn" onclick="confirmLineSubmit(false)" style="background: #999; color: white;">いいえ</button>' +
                '</div>';
            
            addMessage(discountMsg, 'bot');
        }

        // ===== LINE送信確認 =====
        function confirmLineSubmit(confirmed) {
            if (confirmed) {
                addMessage('はい(LINE送信)', 'user');
                // LINE割引を適用
                estimateData.total = estimateData.total - 1000;
                // 名前・電話番号入力へ
                setTimeout(function() {
                    showContactForm();
                }, 300);
            } else {
                addMessage('いいえ', 'user');
                addMessage('承知しました。お電話でのご相談をお待ちしております。', 'bot');
                showContactNumbers();
            }
        }

        // ===== 電話番号表示 =====
        function showContactNumbers() {
            const contactMsg = '<div style="background: #FFF3E0; padding: 20px; border-radius: 10px; margin: 15px 0; border: 2px solid #FF9800;">' +
                '<p style="font-weight: bold; font-size: 16px; margin-bottom: 15px; color: #E65100;">📞 お問い合わせ先</p>' +
                '<div style="margin-bottom: 15px; padding: 10px; background: white; border-radius: 5px;">' +
                '<p style="font-weight: bold; margin-bottom: 5px;">出動依頼の確認</p>' +
                '<a href="tel:050-5527-6162" style="font-size: 20px; color: #D32F2F; text-decoration: none; font-weight: bold;">📞 050-5527-6162</a>' +
                '</div>' +
                '<div style="padding: 10px; background: white; border-radius: 5px;">' +
                '<p style="font-weight: bold; margin-bottom: 5px;">相談</p>' +
                '<a href="tel:050-5846-4108" style="font-size: 20px; color: #D32F2F; text-decoration: none; font-weight: bold;">📞 050-5846-4108</a>' +
                '</div>' +
                '</div>';
            
            addMessage(contactMsg, 'bot');
        }

        // ===== 結果表示 =====
        function calculateAndShowResult() {
            if (estimateData.serviceType === 'towing') {
                // レッカーの合計計算（割引は既に適用済み）
                
                // 内訳
                let breakdownHTML = '<div class="result-breakdown">';
                breakdownHTML += '<p><span>出張料</span><span>¥' + estimateData.areaFee.toLocaleString() + '</span></p>';
                breakdownHTML += '<p><span>距離料金 (' + estimateData.distance + 'km)</span><span>¥' + estimateData.distanceFee.toLocaleString() + '</span></p>';
                if (estimateData.situation === 'accident') {
                    breakdownHTML += '<p><span>事故時追加料金</span><span>×' + accidentMultiplier[estimateData.bikeClass] + '</span></p>';
                }
                if (estimateData.timeFee > 0) {
                    breakdownHTML += '<p><span>時間帯追加料金</span><span>¥' + estimateData.timeFee.toLocaleString() + '</span></p>';
                }
                
                // LINE割引を表示
                breakdownHTML += '<p style="color: #4CAF50; font-weight: bold;"><span>LINE送信割引</span><span>-¥1,000</span></p>';
                
                // 任意保険の場合
                if (estimateData.situation === 'insurance') {
                    breakdownHTML += '<p style="color: #D32F2F; font-weight: bold; margin-top: 10px;"><span>【現金精算なし】</span></p>';
                    breakdownHTML += '<p style="color: #666; font-size: 12px;"><span>任意保険での対応</span></p>';
                    breakdownHTML += '<p style="color: #666; font-size: 11px; margin-top: 5px;"><span>保険案件は現金カード価格とは異なります。</span></p>';
                }
                
                breakdownHTML += '</div>';
                
                document.getElementById('resultBreakdown').innerHTML = breakdownHTML;
            } else {
                // 出張修理の合計計算（割引は既に適用済み）
                
                // 内訳
                let breakdownHTML = '<div class="result-breakdown">';
                breakdownHTML += '<p><span>出張料金</span><span>¥' + estimateData.areaFee.toLocaleString() + '</span></p>';
                breakdownHTML += '<p><span>作業料金</span><span>¥' + estimateData.repairFee.toLocaleString() + '</span></p>';
                if (estimateData.timeFee > 0) {
                    breakdownHTML += '<p><span>時間帯追加料金</span><span>¥' + estimateData.timeFee.toLocaleString() + '</span></p>';
                }
                
                // LINE割引を表示
                breakdownHTML += '<p style="color: #4CAF50; font-weight: bold;"><span>LINE送信割引</span><span>-¥1,000</span></p>';
                
                breakdownHTML += '</div>';
                
                document.getElementById('resultBreakdown').innerHTML = breakdownHTML;
            }
            
            document.getElementById('resultTotal').textContent = '合計: ¥' + estimateData.total.toLocaleString();
            document.getElementById('resultPanel').style.display = 'block';
            
            isEstimateComplete = true; // 見積もり完了フラグを設定
            
            addMessage('お見積もりが完了しました！', 'bot');
            showContactNumbers();
        }

        // ===== LINE送信確認 =====
        function showLineSendConfirmation() {
            const msg = '<p style="font-size: 16px; font-weight: bold; margin-bottom: 15px;">この内容でLINEに送信しますか？</p>' +
                '<p style="font-size: 14px; color: #666; margin-bottom: 20px;">見積もり内容を担当者に送信できます</p>' +
                '<div class="button-group" style="display: flex; gap: 10px;">' +
                '<button class="option-btn" onclick="confirmLineSend(true)" style="background: #06C755; color: white; flex: 1;">はい（送信する）</button>' +
                '<button class="option-btn" onclick="confirmLineSend(false)" style="background: #999; color: white; flex: 1;">いいえ</button>' +
                '</div>';
            addMessage(msg, 'bot');
        }

        function confirmLineSend(willSend) {
            if (willSend) {
                addMessage('はい（送信する）', 'user');
                // 名前・携帯番号入力へ
                setTimeout(function() {
                    showContactForm();
                }, 300);
            } else {
                addMessage('いいえ', 'user');
                // LINE送信しない場合は、仮の情報で見積もりを表示
                estimateData.name = '（未入力）';
                estimateData.phone = '（未入力）';
                calculateEstimate();
                
                // 見積もり表示後、トップページへ戻るボタンを表示
                setTimeout(function() {
                    const msg = '<p style="font-size: 16px; margin-bottom: 15px;">ご利用ありがとうございました。</p>' +
                        '<button class="option-btn" onclick="window.location.href=\'https://rescue-1.jp/\'" style="background: #D32F2F; color: white; width: 100%; padding: 15px; font-size: 16px;">トップページへ戻る</button>';
                    addMessage(msg, 'bot');
                }, 1500);
            }
        }

        // ===== 最終確認（見積もり確認後） =====
        function showFinalConfirmation() {
            const msg = '<p style="font-size: 16px; font-weight: bold; margin-bottom: 15px;">この問診データを送信、担当者と連絡しますか？</p>' +
                '<p style="font-size: 14px; color: #666; margin-bottom: 20px;">LINEで問診内容を送信できます</p>' +
                '<div class="button-group" style="display: flex; gap: 10px;">' +
                '<button class="option-btn" onclick="confirmFinalSend(true)" style="background: #06C755; color: white; flex: 1;">はい（送信する）</button>' +
                '<button class="option-btn" onclick="confirmFinalSend(false)" style="background: #999; color: white; flex: 1;">いいえ（終了）</button>' +
                '</div>';
            addMessage(msg, 'bot');
        }

        function confirmFinalSend(willSend) {
            if (willSend) {
                addMessage('はい（送信する）', 'user');
                // LINE送信画面を表示
                setTimeout(function() {
                    sendToLine();
                }, 300);
            } else {
                addMessage('いいえ（終了）', 'user');
                // トップページへ戻る
                setTimeout(function() {
                    const msg = '<p style="font-size: 16px; margin-bottom: 15px;">ご利用ありがとうございました。</p>' +
                        '<button class="option-btn" onclick="window.location.href=\'https://rescue-1.jp/\'" style="background: #D32F2F; color: white; width: 100%; padding: 15px; font-size: 16px;">トップページへ戻る</button>';
                    addMessage(msg, 'bot');
                }, 300);
            }
        }

        // ===== LINE送信 =====
        function sendToLine() {
            // 見積もり内容を作成
            let message = '【RESCUE-1 お見積もり】\n\n';
            
            // お客様情報
            message += '■お客様情報\n';
            message += 'お名前: ' + estimateData.name + '\n';
            message += '携帯番号: ' + estimateData.phone + '\n';
            
            // 位置情報の有無（レッカーサービスの場合のみ）
            if (estimateData.serviceType === 'towing' && estimateData.hasLocation !== undefined) {
                if (estimateData.hasLocation && estimateData.latitude && estimateData.longitude) {
                    message += '位置情報: 添付あり\n';
                    message += '緯度: ' + estimateData.latitude.toFixed(6) + '\n';
                    message += '経度: ' + estimateData.longitude.toFixed(6) + '\n';
                    message += 'Googleマップ: https://www.google.com/maps?q=' + estimateData.latitude + ',' + estimateData.longitude + '\n';
                } else {
                    message += '位置情報: 添付なし\n';
                }
            }
            message += '\n';
            
            // サービス内容
            message += '■サービス内容\n';
            message += 'サービス: ' + (estimateData.serviceType === 'towing' ? 'レッカー' : '出張修理') + '\n';
            message += '出発地: ' + estimateData.prefecture + ' ' + estimateData.municipality + '\n';
            
            if (estimateData.serviceType === 'towing') {
                // ★修正点 1★
                // displacement ではなく bikeClass (例: "50~125クラス") を表示
                message += 'バイク: ' + estimateData.bikeClass + '\n';
                message += '距離: ' + estimateData.distance + 'km\n';
                
                // 行き先を追加
                if (estimateData.destinationPrefecture && estimateData.destinationCity) {
                    message += '行き先: ' + estimateData.destinationPrefecture + ' ' + estimateData.destinationCity + '\n';
                }
                
                message += '状況: ' + (estimateData.situation === 'none' ? '軽微な故障' : estimateData.situation === 'accident' ? '手押しができない事故' : estimateData.situation === 'insurance' ? '任意保険の利用' : '軽微な事故') + '\n';
            } else {
                message += 'メーカー: ' + estimateData.maker + '\n';
                message += '車種: ' + estimateData.vehicle.model + '\n';
                message += '修理内容: ' + estimateData.repairType + '\n';
            }
            
            // 任意保険の場合は現金精算なしを表示
            if (estimateData.situation === 'insurance') {
                message += '\n【現金精算なし】\n';
                message += '任意保険での対応となります\n';
                message += '※保険案件は現金カード価格とは異なります。\n';
            }
            
            message += '\n💰 LINE送信割引: -¥1,000\n';
            message += '合計金額: ¥' + estimateData.total.toLocaleString() + '\n';
            message += '\n📞 出動依頼の確認: 050-5527-6162\n';
            message += '📞 相談: 050-5846-4108\n';
            message += '\n※この見積もりは概算です。実際の料金は状況により変動する場合があります。';
            
            // テキストエリアを作成して表示（ユーザーが送信前に確認・編集できるように）
            const textarea = document.createElement('textarea');
            textarea.value = message;
            textarea.id = 'lineMessageText';
            textarea.readOnly = false; // 編集可能にする
            textarea.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 500px; height: 400px; padding: 15px; font-size: 14px; border: 2px solid #D32F2F; border-radius: 10px; z-index: 10000; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;';
            document.body.appendChild(textarea);
            
            // 説明テキストを追加
            const instructionBox = document.createElement('div');
            instructionBox.style.cssText = 'position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; padding: 15px; background: #E8F5E9; border: 2px solid #4CAF50; border-radius: 10px; z-index: 10001; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2);';
            // ★修正点 2★ 説明文を変更
            instructionBox.innerHTML = '<p style="font-weight: bold; color: #2E7D32; margin: 0; font-size: 14px;">📱 ボタンを押すとLINEが開きます<br>内容を確認し、トーク画面で送信してください</p>';
            document.body.appendChild(instructionBox);
            
            // モバイル対応：自動選択とフォーカス
            setTimeout(function() {
                textarea.focus();
                textarea.select();
                textarea.setSelectionRange(0, textarea.value.length);
            }, 100);
            
            // オーバーレイを作成
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 9999;';
            document.body.appendChild(overlay);
            
            // ボタンコンテナを作成
            const buttonContainer = document.createElement('div');
            buttonContainer.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 0 10px;';
            
            // LINEで送信ボタン
            const lineSendBtn = document.createElement('button');
            lineSendBtn.textContent = '📱 LINEで送信';
            lineSendBtn.style.cssText = 'padding: 18px 40px; font-size: 18px; font-weight: bold; background: #06C755; color: white; border: none; border-radius: 12px; cursor: pointer; width: 100%; max-width: 300px; box-shadow: 0 4px 12px rgba(6,199,85,0.3);';
            
            // ★修正点 3★ onclickのロジックを全面変更
            lineSendBtn.onclick = function() {
                // 送信するテキストを取得（ユーザーが編集した場合も考慮）
                const txt = document.getElementById('lineMessageText').value;
                
                // テキストをURLエンコード
                const encodedMessage = encodeURIComponent(txt);
                
                // LINEのURLスキームを作成（公式アカウント@367ajtsp宛にメッセージをセット）
                // これにより、LINEアプリが開き、トーク入力欄に自動でテキストがセットされます。
                const lineUrl = 'https://line.me/R/oaMessage/@367ajtsp/?' + encodedMessage;
                
                // ボタンのテキストを変更
                lineSendBtn.textContent = '✅ LINEを開いています...';
                lineSendBtn.style.background = '#2196F3';
                
                // LINE URLスキームを開く（主にモバイルデバイス向け）
                window.location.href = lineUrl;

                // 画面を閉じるための後処理
                setTimeout(function() {
                    if (document.body.contains(textarea)) {
                        document.body.removeChild(textarea);
                    }
                    if (document.body.contains(overlay)) {
                        document.body.removeChild(overlay);
                    }
                    if (document.body.contains(buttonContainer)) {
                        document.body.removeChild(buttonContainer);
                    }
                    if (document.body.contains(instructionBox)) {
                        document.body.removeChild(instructionBox);
                    }
                }, 1500); // 1.5秒後に実行
            };
            
            buttonContainer.appendChild(lineSendBtn);
            document.body.appendChild(buttonContainer);
            
            // オーバーレイクリックで閉じる
            overlay.onclick = function() {
                document.body.removeChild(textarea);
                document.body.removeChild(overlay);
                document.body.removeChild(buttonContainer);
                document.body.removeChild(instructionBox);
            };
        }

        // ===== 電話発信 =====
        function callRescue() {
            window.location.href = 'tel:050-5527-6162';
        }
    </script>
