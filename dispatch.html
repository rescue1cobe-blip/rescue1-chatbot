<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RESCUE-1 配車記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --surface:#161B22; --surface2:#1E242D; --line:#2A313C;
    --text:#E8EDF2; --muted:#8893A0; --faint:#5A6472;
    --amber:#FFA62B; --amber-dim:rgba(255,166,43,.13);
    --red:#FF5252; --red-dim:rgba(255,82,82,.13);
    --green:#36C275; --green-dim:rgba(54,194,117,.13);
    --blue:#5AA9FF; --blue-dim:rgba(90,169,255,.12);
    --font:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1200px 600px at 50% -10%, #1a212c 0%, transparent 60%), var(--bg);
    color:var(--text); font-family:var(--font); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:22px 14px 56px; gap:16px;}
  .masthead{width:100%;max-width:412px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .r1{font-weight:900;font-size:19px;letter-spacing:.06em}
  .brand .r1 span{color:var(--amber)}
  .brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
  .topbtn{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-family:var(--font)}
  .topbtn:active{transform:scale(.97)}
  .shell{width:100%;max-width:412px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02) inset}
  .head{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface2);min-height:54px}
  .head .back{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--amber);background:none;border:none;cursor:pointer;padding:6px 4px;font-family:var(--font)}
  .head .htitle{font-size:15px;font-weight:700}
  .head .hsub{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-left:auto}
  .listbody{padding:14px 14px 18px}
  .listmeta{display:flex;gap:8px;margin-bottom:13px;padding:0 2px}
  .mpill{font-size:11px;font-weight:700;font-family:var(--mono);padding:5px 11px;border-radius:7px;letter-spacing:.03em}
  .mpill.act{color:var(--amber);background:var(--amber-dim);border:1px solid rgba(255,166,43,.3)}
  .mpill.don{color:var(--green);background:var(--green-dim);border:1px solid rgba(54,194,117,.3)}
  .case{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:11px;cursor:pointer;transition:transform .07s,border-color .15s}
  .case:active{transform:scale(.985)}
  .case.done{opacity:.6;border-style:dashed}
  .case .ctop{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .sbadge{font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
  .sbadge.act{color:var(--amber);background:var(--amber-dim);border:1px solid rgba(255,166,43,.35)}
  .sbadge.don{color:var(--green);background:var(--green-dim);border:1px solid rgba(54,194,117,.35)}
  .cname{font-size:20px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmeta{display:flex;gap:7px;flex-wrap:wrap}
  .cchip{font-size:12px;font-weight:500;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:7px}
  .cchip.mono{font-family:var(--mono)}
  .cstep{margin-top:10px;font-size:13px;font-weight:700;color:var(--amber);display:flex;align-items:center;gap:6px}
  .case.done .cstep{color:var(--green)}
  .cdel{position:absolute;top:11px;right:11px;width:38px;height:38px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--faint);font-size:20px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer}
  .case.done .cdel{display:flex}
  .cdel:active{background:var(--red-dim);color:var(--red);border-color:rgba(255,82,82,.4)}
  .newbtn{width:100%;padding:18px;border:none;border-radius:14px;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;background:var(--amber);color:#10141a;box-shadow:0 8px 24px -8px rgba(255,166,43,.55);display:flex;align-items:center;justify-content:center;gap:9px;margin-top:3px}
  .newbtn:active{transform:scale(.99)}
  .empty{text-align:center;color:var(--faint);padding:46px 20px;font-size:13.5px;line-height:1.7}
  .rail{display:flex;padding:13px 8px 5px;gap:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.012);overflow-x:auto}
  .rstep{flex:1 0 auto;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  .rstep::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
  .rstep:first-child::before{display:none}
  .rstep.done::before,.rstep.active::before{background:var(--amber)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:1;transition:.25s}
  .rstep.done .dot{background:var(--amber);border-color:var(--amber)}
  .rstep.active .dot{background:var(--surface);border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
  .rlbl{font-size:9px;color:var(--faint);white-space:nowrap;transition:.25s}
  .rstep.active .rlbl{color:var(--amber);font-weight:700}
  .rstep.done .rlbl{color:var(--muted)}
  .stage{padding:16px 16px 4px;min-height:200px}
  .kicker{font-size:11px;letter-spacing:.13em;color:var(--amber);font-weight:700;text-transform:uppercase;margin-bottom:9px}
  .headline{font-size:15px;font-weight:700;line-height:1.5;margin-bottom:14px}
  .field{margin-bottom:13px}
  .field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;letter-spacing:.02em;font-weight:500}
  .inwrap{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 13px}
  .inwrap input,.inwrap textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:16px;font-weight:500;padding:13px 0;min-width:0}
  .inwrap textarea{font-family:var(--font);font-size:14px;resize:none;line-height:1.5}
  .inwrap .unit{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500;flex:none}
  .inwrap:focus-within{border-color:var(--amber)}
  select.big{width:100%;font-family:var(--font);font-size:21px;font-weight:700;padding:17px 14px;color:var(--text);background:var(--surface2);border:1.5px solid var(--amber);border-radius:11px;appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 24 24' fill='none' stroke='%23FFA62B' stroke-width='3'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:48px}
  select.big:focus{outline:none}
  select.big.placeholder{color:var(--faint);font-weight:500;border-color:var(--line)}
  .toll{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px}
  .toll .tt{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:11px;letter-spacing:.02em}
  .toll .field{margin-bottom:10px}
  .toll .field:last-child{margin-bottom:0}
  .recnote{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:4px;padding-left:2px}
  .sig-note{display:flex;gap:9px;align-items:flex-start;background:var(--blue-dim);border:1px solid rgba(90,169,255,.28);border-radius:11px;padding:10px 12px;margin-bottom:11px}
  .sig-note svg{flex:none;margin-top:1px}
  .sig-note p{font-size:11.5px;line-height:1.5;color:#bcd6f5}
  .sig-pad-wrap{position:relative;border:1.5px dashed var(--line);border-radius:13px;background:#0c1014;overflow:hidden;height:152px}
  .sig-pad-wrap.signed{border-style:solid;border-color:rgba(54,194,117,.5)}
  #sigCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .sig-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--faint);font-size:13px;gap:8px}
  .sig-clear{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer}
  .done-wrap{text-align:center;padding:10px 0 0}
  .done-check{width:62px;height:62px;border-radius:50%;background:var(--green-dim);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;margin:4px auto 14px}
  .done-h{font-size:18px;font-weight:700;margin-bottom:6px}
  .done-p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
  .actionbar{padding:8px 16px 18px;background:var(--surface)}
  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:9px}
  .btn:active{transform:scale(.978)}
  .btn-amber{background:var(--amber);color:#10141a;box-shadow:0 8px 24px -8px rgba(255,166,43,.55)}
  .btn-green{background:var(--green);color:#08120c;box-shadow:0 8px 24px -8px rgba(54,194,117,.5)}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .btnrow{display:flex;gap:10px}
  .btnrow .btn{flex:1}
  .btn-ghost.flex0{flex:0 0 34%}
  .ledger{width:100%;max-width:412px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .ledger-head{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
  .ledger-head .lh-t{font-size:13px;font-weight:700}
  .ledger-head .lh-s{font-size:10.5px;color:var(--muted);margin-left:auto;font-family:var(--mono)}
  .ledger-grid{padding:6px 8px 10px}
  .lg-row{display:flex;align-items:center;justify-content:space-between;padding:6.5px 8px;border-radius:7px;gap:12px}
  .lg-row:nth-child(odd){background:rgba(255,255,255,.018)}
  .lg-row .lk{font-size:11px;color:var(--muted);flex:none}
  .lg-row .lv{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--faint);transition:.3s;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
  .lg-row .lv.filled{color:var(--text)}
  .ledger-foot{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint);line-height:1.5}
  .ledger-foot b{color:var(--muted);font-weight:500}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:500;padding:12px 20px;border-radius:11px;box-shadow:0 12px 30px -8px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="masthead">
  <div class="brand"><span class="r1">RESCUE<span>-1</span></span><span class="tag">配車記録</span></div>
  <button class="topbtn" id="exportBtn" onclick="exportCSV()">CSV出力</button>
</div>
<div class="shell" id="listShell">
  <div class="head"><span class="htitle">案件一覧</span><span class="hsub" id="listClock"></span></div>
  <div class="listbody">
    <div class="listmeta" id="listMeta"></div>
    <div id="caseList"></div>
    <button class="newbtn" onclick="newCase()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#10141a" stroke-width="2.4" stroke-linecap="round"/></svg>新規案件</button>
  </div>
</div>
<div id="flowWrap" style="width:100%;max-width:412px;display:none;flex-direction:column;gap:16px">
  <div class="shell">
    <div class="head">
      <button class="back" onclick="goList()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#FFA62B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>一覧</button>
      <span class="hsub" id="flowCaseId"></span>
    </div>
    <div class="rail" id="rail">
      <div class="rstep" data-s="1"><div class="dot"></div><div class="rlbl">指令</div></div>
      <div class="rstep" data-s="2"><div class="dot"></div><div class="rlbl">出動</div></div>
      <div class="rstep" data-s="3"><div class="dot"></div><div class="rlbl">現着</div></div>
      <div class="rstep" data-s="4"><div class="dot"></div><div class="rlbl">作業</div></div>
      <div class="rstep" data-s="5"><div class="dot"></div><div class="rlbl">サイン</div></div>
      <div class="rstep" data-s="6"><div class="dot"></div><div class="rlbl">報告</div></div>
      <div class="rstep" data-s="7"><div class="dot"></div><div class="rlbl">完了</div></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="actionbar" id="actionbar"></div>
  </div>
  <div class="ledger">
    <div class="ledger-head">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#FFA62B" stroke-width="1.8"/><path d="M3 9h18M9 9v12M3 15h18" stroke="#FFA62B" stroke-width="1.4"/></svg>
      <span class="lh-t">台帳に書き込まれる内容</span>
      <span class="lh-s" id="ledgerState">—</span>
    </div>
    <div class="ledger-grid" id="ledgerGrid"></div>
    <div class="ledger-foot"><b>記録項目：</b> 日付／担当者／名前／車種／電話／ナンバー／内容／回送・実車（距離）／回送高速・実車高速（IN・OUT・料金）／保険。<b>金額計算は行いません。</b></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const STAFF=['浜崎','三木','砂津','池田'];
const TYPES=['jp','搬送','搬送1','搬送2'];
const INSURERS=['チューリッヒ','ウェルネスト'];
const STEPS=['指令','出動','現着','作業','サイン','報告','完了'];
const STATE_LABEL=['指令入力','出動','現着','作業','署名','報告入力','完了'];
const STORE_KEY='rescue1_dispatch_cases_v1';
const SEQ_KEY='rescue1_dispatch_seq_v1';

function loadSeq(){const n=parseInt(localStorage.getItem(SEQ_KEY)||'0',10);return isNaN(n)?0:n;}
function nextId(){const n=loadSeq()+1;localStorage.setItem(SEQ_KEY,String(n));return '#'+String(n).padStart(4,'0');}
function blankCase(){return{id:nextId(),date:todayMD(),step:1,status:'active',name:'',vehicle:'',phone:'',plate:'',type:'',assignee:'',addr:'',departNote:'',arriveNote:'',kaisouKm:'',jishaKm:'',kaisouIn:'',kaisouOut:'',kaisouYen:'',jishaIn:'',jishaOut:'',jishaYen:'',ins:'',note:'',sig:null};}

let cases=[];let curId=null;
const $=id=>document.getElementById(id);
const cur=()=>cases.find(c=>c.id===curId);

function loadCases(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed))cases=parsed;}}
  catch(e){console.warn('保存データの読込に失敗しました',e);cases=[];}
}
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(cases));}
  catch(e){console.warn('保存に失敗しました',e);toast('保存に失敗しました');}
}

function goList(){curId=null;$('flowWrap').style.display='none';$('listShell').style.display='block';renderList();}
function openCase(id){curId=id;$('listShell').style.display='none';$('flowWrap').style.display='flex';render();window.scrollTo({top:0,behavior:'smooth'});}
function newCase(){const c=blankCase();cases.unshift(c);save();openCase(c.id);}
function delCase(id,ev){if(ev)ev.stopPropagation();if(confirm('この完了案件をリストから消しますか？\n（この操作は取り消せません）')){cases=cases.filter(c=>c.id!==id);save();renderList();}}

function renderList(){
  const act=cases.filter(c=>c.status==='active').length;
  const don=cases.filter(c=>c.status==='done').length;
  $('listMeta').innerHTML=cases.length?`<span class="mpill act">進行中 ${act}</span><span class="mpill don">完了 ${don}</span>`:'';
  const wrap=$('caseList');
  if(!cases.length){wrap.innerHTML='<div class="empty">案件はまだありません。<br>下の「新規案件」から始めてください。</div>';return;}
  const sorted=[...cases].sort((a,b)=>a.status===b.status?0:(a.status==='active'?-1:1));
  wrap.innerHTML=sorted.map(c=>{
    const done=c.status==='done';
    const badge=done?'<span class="sbadge don">完了</span>':'<span class="sbadge act">進行中</span>';
    const stepTxt=done?'記録済み':`${STEPS[c.step-1]}まで`;
    const chips=[];
    if(c.assignee)chips.push(`<span class="cchip">${esc(c.assignee)}</span>`);
    if(c.type)chips.push(`<span class="cchip">${esc(c.type)}</span>`);
    if(c.vehicle)chips.push(`<span class="cchip mono">${esc(c.vehicle)}</span>`);
    if(!chips.length)chips.push('<span class="cchip">未入力</span>');
    return `<div class="case ${done?'done':''}" onclick="openCase('${esc(c.id)}')"><div class="cdel" onclick="delCase('${esc(c.id)}',event)">×</div><div class="ctop">${badge}<span class="cname">${c.name?esc(c.name):'（名前未入力）'}</span></div><div class="cmeta">${chips.join('')}</div><div class="cstep">▸ ${stepTxt}</div></div>`;
  }).join('');
}
function next(){const c=cur();if(c&&c.step<7){c.step++;save();render();window.scrollTo({top:0,behavior:'smooth'});}}
function prev(){const c=cur();if(c&&c.step>1){c.step--;save();render();window.scrollTo({top:0,behavior:'smooth'});}}
function render(){
  const c=cur();if(!c)return;
  $('flowCaseId').textContent='案件 '+c.id;
  document.querySelectorAll('.rstep').forEach(el=>{const s=+el.dataset.s;el.classList.toggle('done',s<c.step);el.classList.toggle('active',s===c.step);});
  renderStage();renderLedger();
}
function renderStage(){
  const c=cur();const stage=$('stage');const bar=$('actionbar');
  if(c.step===1){
    stage.innerHTML=`<div class="kicker">① 指令受付</div><div class="headline" style="font-size:14px">依頼内容を入力して担当を割り当て。</div>
      <div class="field"><label>内容</label><select id="f_type" class="big ${c.type?'':'placeholder'}" onchange="bindSel('type',this)"><option value="" ${c.type?'':'selected'}>選択してください</option>${TYPES.map(t=>`<option value="${esc(t)}" ${c.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><label>お客様名</label><div class="inwrap"><input id="f_name" placeholder="例）田中 健一" value="${attr(c.name)}" oninput="bind('name',this.value)"></div></div>
      <div class="field"><label>電話</label><div class="inwrap"><input id="f_phone" inputmode="tel" placeholder="090-0000-0000" value="${attr(c.phone)}" oninput="bind('phone',this.value)"></div></div>
      <div class="field"><label>車種</label><div class="inwrap"><input id="f_vehicle" placeholder="例）CB400SF" value="${attr(c.vehicle)}" oninput="bind('vehicle',this.value)"></div></div>
      <div class="field"><label>ナンバー</label><div class="inwrap"><input id="f_plate" placeholder="例）なにわ あ 12-34" value="${attr(c.plate)}" oninput="bind('plate',this.value)"></div></div>
      <div class="field"><label>現場住所</label><div class="inwrap"><input id="f_addr" placeholder="出動先の住所" value="${attr(c.addr)}" oninput="bind('addr',this.value)"></div></div>
      <div class="field"><label>担当隊員</label><select id="f_assignee" class="big ${c.assignee?'':'placeholder'}" onchange="bindSel('assignee',this)"><option value="" ${c.assignee?'':'selected'}>選択してください</option>${STAFF.map(s=>`<option value="${esc(s)}" ${c.assignee===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
    bar.innerHTML=`<button class="btn btn-amber" onclick="next()">出動へ →</button>`;return;
  }
  if(c.step===2){
    stage.innerHTML=`<div class="kicker">② 出動</div><div class="headline">現場へ向かいます。</div><div class="field"><label>出動メモ（任意）</label><div class="inwrap"><textarea id="f_depart" rows="2" placeholder="装備・経路など" oninput="bind('departNote',this.value)">${esc(c.departNote)}</textarea></div></div>`;
    bar.innerHTML=`<div class="btnrow"><button class="btn btn-ghost flex0" onclick="prev()">← 戻る</button><button class="btn btn-amber" onclick="next()">出動開始 →</button></div>`;return;
  }
  if(c.step===3){
    stage.innerHTML=`<div class="kicker">③ 現着</div><div class="headline">現場到着・状況確認。</div><div class="field"><label>現場状況（任意）</label><div class="inwrap"><textarea id="f_arrive" rows="3" placeholder="車両の状態・周辺状況など" oninput="bind('arriveNote',this.value)">${esc(c.arriveNote)}</textarea></div></div>`;
    bar.innerHTML=`<div class="btnrow"><button class="btn btn-ghost flex0" onclick="prev()">← 戻る</button><button class="btn btn-amber" onclick="next()">作業へ →</button></div>`;return;
  }
  if(c.step===4){
    stage.innerHTML=`<div class="kicker">④ 作業記録</div><div class="headline" style="font-size:14px">距離と高速を記録（金額計算なし）。</div>
      <div class="field"><label>回送 距離（拠点→現場）</label><div class="inwrap"><input id="f_kaisouKm" inputmode="decimal" placeholder="0.0" value="${attr(c.kaisouKm)}" oninput="bindNum('kaisouKm',this)"><span class="unit">km</span></div></div>
      <div class="field"><label>実車 距離（現場→搬送先）</label><div class="inwrap"><input id="f_jishaKm" inputmode="decimal" placeholder="0.0" value="${attr(c.jishaKm)}" oninput="bindNum('jishaKm',this)"><span class="unit">km</span></div></div>
      <div class="toll"><div class="tt">回送 高速</div>
        <div class="field"><label>IN（入口）</label><div class="inwrap"><input id="f_kaisouIn" placeholder="入口IC" value="${attr(c.kaisouIn)}" oninput="bind('kaisouIn',this.value)"></div></div>
        <div class="field"><label>OUT（出口）</label><div class="inwrap"><input id="f_kaisouOut" placeholder="出口IC" value="${attr(c.kaisouOut)}" oninput="bind('kaisouOut',this.value)"></div></div>
        <div class="field"><label>料金</label><div class="inwrap"><input id="f_kaisouYen" inputmode="numeric" placeholder="0" value="${attr(c.kaisouYen)}" oninput="bindYen('kaisouYen',this)"><span class="unit">円</span></div></div></div>
      <div class="toll"><div class="tt">実車 高速</div>
        <div class="field"><label>IN（入口）</label><div class="inwrap"><input id="f_jishaIn" placeholder="入口IC" value="${attr(c.jishaIn)}" oninput="bind('jishaIn',this.value)"></div></div>
        <div class="field"><label>OUT（出口）</label><div class="inwrap"><input id="f_jishaOut" placeholder="出口IC" value="${attr(c.jishaOut)}" oninput="bind('jishaOut',this.value)"></div></div>
        <div class="field"><label>料金</label><div class="inwrap"><input id="f_jishaYen" inputmode="numeric" placeholder="0" value="${attr(c.jishaYen)}" oninput="bindYen('jishaYen',this)"><span class="unit">円</span></div></div></div>
      <div class="recnote">※ 金額計算はしません。回送・実車それぞれの距離と高速（IN・OUT・料金）を記録するだけです。</div>`;
    bar.innerHTML=`<div class="btnrow"><button class="btn btn-ghost flex0" onclick="prev()">← 戻る</button><button class="btn btn-amber" onclick="next()">サインへ →</button></div>`;return;
  }
  if(c.step===5){
    stage.innerHTML=`<div class="kicker">④ お客様サイン</div>
      <div class="sig-note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 6v6c0 5 3.8 8.5 9 10 5.2-1.5 9-5 9-10V6l-9-4z" stroke="#5AA9FF" stroke-width="1.6"/><path d="M9 12l2 2 4-4" stroke="#5AA9FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>サインは個人情報を取得しません。</b>指で署名してもらってください。</p></div>
      <div class="sig-pad-wrap ${c.sig?'signed':''}" id="sigWrap"><canvas id="sigCanvas"></canvas><div class="sig-ph" id="sigPh" style="display:${c.sig?'none':'flex'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 17.5L14 6.5l3.5 3.5L6.5 21H3v-3.5z" stroke="#5A6472" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7.5l3.5 3.5" stroke="#5A6472" stroke-width="1.6"/></svg>ここに指で署名</div><div class="sig-clear" id="sigClear" style="display:${c.sig?'block':'none'}" onclick="clearSig()">消す</div></div>`;
    bar.innerHTML=`<div class="btnrow"><button class="btn btn-ghost flex0" onclick="prev()">← 戻る</button><button class="btn btn-amber" onclick="next()">確認へ →</button></div>`;
    setTimeout(initSig,30);return;
  }
  if(c.step===6){
    stage.innerHTML=`<div class="kicker">⑤ 報告確認</div><div class="headline">内容を確認して完了。</div>
      <div class="field"><label>保険（任意）</label><select id="f_ins" class="big ${c.ins?'':'placeholder'}" onchange="bindSel('ins',this)"><option value="" ${c.ins?'':'selected'}>なし（直貼）</option>${INSURERS.map(i=>`<option value="${esc(i)}" ${c.ins===i?'selected':''}>${esc(i)}</option>`).join('')}</select></div>
      <div class="field"><label>備考（任意）</label><div class="inwrap"><textarea id="f_note" rows="2" placeholder="特記事項" oninput="bind('note',this.value)">${esc(c.note)}</textarea></div></div>`;
    bar.innerHTML=`<div class="btnrow"><button class="btn btn-ghost flex0" onclick="prev()">← 戻る</button><button class="btn btn-green" onclick="complete()">完了 ✓</button></div>`;return;
  }
  if(c.step===7){
    stage.innerHTML=`<div class="done-wrap"><div class="done-check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#36C275" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="done-h">記録が完了しました</div><div class="done-p">台帳に記録されました。<br>一覧に戻ると、進行中の他案件を続けられます。</div></div>`;
    bar.innerHTML=`<button class="btn btn-ghost" onclick="goList()">案件一覧へ戻る</button>`;return;
  }
}
function complete(){const c=cur();if(!c)return;c.status='done';c.step=7;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function bind(key,val){const c=cur();if(!c)return;c[key]=val;save();renderLedger();}
function bindSel(key,el){const c=cur();if(!c)return;c[key]=el.value;el.classList.toggle('placeholder',!el.value);save();renderLedger();}
function bindNum(key,el){const c=cur();if(!c)return;let v=el.value.replace(/[^0-9.]/g,'');const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');el.value=v;c[key]=v;save();renderLedger();}
function bindYen(key,el){const c=cur();if(!c)return;el.value=el.value.replace(/[^0-9]/g,'');c[key]=el.value;save();renderLedger();}
function renderLedger(){
  const c=cur();if(!c)return;
  const kaisouToll=[c.kaisouIn,c.kaisouOut].filter(Boolean).join('→')+(c.kaisouYen?` ¥${(+c.kaisouYen).toLocaleString('ja-JP')}`:'');
  const jishaToll=[c.jishaIn,c.jishaOut].filter(Boolean).join('→')+(c.jishaYen?` ¥${(+c.jishaYen).toLocaleString('ja-JP')}`:'');
  const rows=[['日付',c.date],['担当者',c.assignee],['名前',c.name],['車種',c.vehicle],['電話',c.phone],['ナンバー',c.plate],['内容',c.type],['現場',c.addr],['回送',c.kaisouKm?c.kaisouKm+' km':''],['実車',c.jishaKm?c.jishaKm+' km':''],['回送高速',kaisouToll.trim()],['実車高速',jishaToll.trim()],['サイン',c.sig?'取得済み':''],['保険',c.ins]];
  $('ledgerGrid').innerHTML=rows.map(([k,v])=>{const filled=!!v;return `<div class="lg-row"><span class="lk">${k}</span><span class="lv ${filled?'filled':''}">${filled?esc(v):'—'}</span></div>`;}).join('');
  $('ledgerState').textContent=c.status==='done'?'完了':(STATE_LABEL[c.step-1]||'—');
}
let sigCtx,sigDrawing=false,sigHasInk=false;
function initSig(){
  const cv=$('sigCanvas');if(!cv)return;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  sigCtx=cv.getContext('2d');sigCtx.scale(dpr,dpr);
  sigCtx.strokeStyle='#E8EDF2';sigCtx.lineWidth=2.6;sigCtx.lineCap='round';sigCtx.lineJoin='round';sigHasInk=false;
  const c=cur();
  if(c&&c.sig){const img=new Image();img.onload=()=>sigCtx.drawImage(img,0,0,r.width,r.height);img.src=c.sig;sigHasInk=true;}
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
  const start=e=>{e.preventDefault();sigDrawing=true;const{x,y}=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);};
  const move=e=>{if(!sigDrawing)return;e.preventDefault();const{x,y}=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();if(!sigHasInk){sigHasInk=true;$('sigPh').style.display='none';$('sigClear').style.display='block';$('sigWrap').classList.add('signed');}};
  const end=()=>{if(!sigDrawing)return;sigDrawing=false;const c=cur();if(c){c.sig=cv.toDataURL();save();renderLedger();}};
  cv.onpointerdown=start;cv.onpointermove=move;cv.onpointerup=end;cv.onpointerleave=end;
}
function clearSig(){const cv=$('sigCanvas');if(cv&&sigCtx){sigCtx.clearRect(0,0,cv.width,cv.height);}sigHasInk=false;const ph=$('sigPh'),cl=$('sigClear'),wr=$('sigWrap');if(ph)ph.style.display='flex';if(cl)cl.style.display='none';if(wr)wr.classList.remove('signed');const c=cur();if(c){c.sig=null;save();renderLedger();}}
function exportCSV(){
  if(!cases.length){toast('出力する案件がありません');return;}
  const cols=[['id','案件ID'],['date','日付'],['status','状態'],['assignee','担当者'],['name','名前'],['phone','電話'],['vehicle','車種'],['plate','ナンバー'],['type','内容'],['addr','現場住所'],['departNote','出動メモ'],['arriveNote','現場状況'],['kaisouKm','回送km'],['jishaKm','実車km'],['kaisouIn','回送高速IN'],['kaisouOut','回送高速OUT'],['kaisouYen','回送高速料金'],['jishaIn','実車高速IN'],['jishaOut','実車高速OUT'],['jishaYen','実車高速料金'],['ins','保険'],['note','備考'],['sig','サイン']];
  const q=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const head=cols.map(([,l])=>q(l)).join(',');
  const body=cases.map(c=>cols.map(([k])=>k==='status'?q(c.status==='done'?'完了':'進行中'):k==='sig'?q(c.sig?'取得済み':''):q(c[k])).join(',')).join('\n');
  const csv='﻿'+head+'\n'+body;
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`rescue1_dispatch_${ymd()}.csv`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('CSVを書き出しました');
}
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function attr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function pad2(n){return String(n).padStart(2,'0');}
function todayMD(){const d=new Date();return `${d.getMonth()+1}/${d.getDate()}`;}
function ymd(){const d=new Date();return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;}
function tickClock(){const d=new Date();const el=$('listClock');if(el)el.textContent=`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
loadCases();tickClock();setInterval(tickClock,30000);goList();
</script>
